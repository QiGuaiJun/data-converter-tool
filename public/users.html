<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>账号管理 - 数据导表工具</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css?v=20260922_auth2" />
    <link rel="stylesheet" href="/theme.css?v=20260912_claude" />
  </head>
  <body>
    <div class="desktop-shell">
      <header class="app-ribbon">
        <a class="ribbon-item" href="/connections.html"><span class="ribbon-icon green">DB</span><span>新建连接</span></a>
        <a class="ribbon-item" href="/"><span class="ribbon-icon orange">IN</span><span>导入</span></a>
        <a class="ribbon-item" href="/export.html"><span class="ribbon-icon cyan">OUT</span><span>导出</span></a>
        <a class="ribbon-item" href="/sync.html"><span class="ribbon-icon red">SYNC</span><span>同步</span></a>
        <a class="ribbon-item" href="/query.html"><span class="ribbon-icon dark">SQL</span><span>查询</span></a>
        <a class="ribbon-item" href="/tables.html"><span class="ribbon-icon blue">TAB</span><span>表</span></a>
        <a class="ribbon-item" href="/jobs.html"><span class="ribbon-icon teal">JOB</span><span>作业</span></a>
        <a class="ribbon-item" href="/schedule.html"><span class="ribbon-icon purple">TIME</span><span>定时任务</span></a>
        <a class="ribbon-item active" href="/users.html"><span class="ribbon-icon black">USR</span><span>账号</span></a>
        <a class="ribbon-item" href="/audit.html"><span class="ribbon-icon black">LOG</span><span>审计</span></a>
      </header>
      <div class="desktop-main">
        <aside class="app-sidebar">
          <div class="sidebar-title">功能</div>
          <nav class="module-tree">
            <a class="tree-node" href="/connections.html"><span>DB</span> 新建连接</a>
            <a class="tree-node" href="/"><span>IN</span> 导入</a>
            <a class="tree-node" href="/export.html"><span>OUT</span> 导出</a>
            <a class="tree-node" href="/sync.html"><span>SYNC</span> 同步</a>
            <a class="tree-node" href="/query.html"><span>SQL</span> 查询</a>
            <a class="tree-node" href="/tables.html"><span>TAB</span> 表</a>
            <a class="tree-node" href="/jobs.html"><span>JOB</span> 作业</a>
            <a class="tree-node" href="/schedule.html"><span>TIME</span> 定时任务</a>
            <a class="tree-node active" href="/users.html"><span>USR</span> 账号管理</a>
            <a class="tree-node" href="/audit.html"><span>LOG</span> 审计日志</a>
          </nav>
          <div class="sidebar-version" id="appVersion">数据导表工具</div>
        </aside>
        <section class="app-workspace">
          <main class="tables-page">
            <section class="tables-toolbar">
              <button id="newUser" class="primary" type="button">新建账号</button>
              <button id="refreshUsers" type="button">刷新</button>
              <span id="userStatus">等待读取</span>
            </section>
            <section class="user-role-legend" id="roleLegend"></section>
            <section class="table-wrap user-table-wrap">
              <table class="user-table">
                <thead>
                  <tr>
                    <th>用户名</th>
                    <th>显示名</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>在线会话</th>
                    <th>最近登录</th>
                    <th>创建来源</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="userRows"></tbody>
              </table>
            </section>
          </main>
        </section>
      </div>
    </div>
    <script src="/version.js?v=20260910_app_version"></script>
    <script src="/users.js?v=20260922_auth"></script>
    <script src="/shell.js?v=20260922_auth2"></script>
  </body>
</html>
