<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - 数据导表工具</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css?v=20260922_auth2" />
    <link rel="stylesheet" href="/theme.css?v=20260912_claude" />
    <style>
      /* 登录页是独立页面：不引入 shell.js（避免登录态检查造成跳转回环），
         样式就近内联，只复用 styles.css 的调色与基础控件。 */
      body.login-body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f4f0;
        font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
        color: #2f2c27;
      }
      .login-card {
        width: 380px;
        max-width: calc(100vw - 40px);
        padding: 30px 32px 26px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid #e4e0d6;
        box-shadow: 0 14px 40px rgba(60, 55, 45, 0.10);
      }
      .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .login-brand-icon {
        width: 34px; height: 34px; border-radius: 9px; background: #2f2c27; color: #fff;
        display: grid; place-items: center; font-size: 13px; letter-spacing: .5px;
      }
      .login-brand strong { font-size: 17px; }
      .login-sub { margin: 6px 0 22px; color: #6c6a64; font-size: 13px; }
      .login-field { margin-bottom: 14px; }
      .login-field label { display: block; font-size: 13px; color: #4a4740; margin-bottom: 6px; }
      .login-field input[type="text"],
      .login-field input[type="password"] {
        width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px;
        border: 1px solid #d8d2c6; border-radius: 9px; font-size: 14px; background: #fdfcfa;
      }
      .login-field input:focus { outline: none; border-color: #8a8578; background: #fff; }
      .login-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; font-size: 13px; color: #4a4740; }
      .login-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
      .login-actions { display: flex; gap: 10px; }
      .login-actions button {
        flex: 1; height: 42px; border-radius: 10px; border: 1px solid #d8d2c6;
        background: #fff; font-size: 14px; cursor: pointer; color: #2f2c27;
      }
      .login-actions button.primary { background: #2f2c27; border-color: #2f2c27; color: #fff; }
      .login-actions button:disabled { opacity: .55; cursor: not-allowed; }
      .login-message { min-height: 20px; margin: 2px 0 10px; font-size: 13px; color: #c0392b; }
      .login-message.ok { color: #13834c; }
      .login-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid #efece4; color: #8a8578; font-size: 12px; line-height: 1.6; }
      .login-hidden { display: none !important; }
    </style>
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="login-brand">
        <span class="login-brand-icon">DC</span>
        <strong>数据导表工具</strong>
      </div>
      <p class="login-sub" id="loginSubtitle">请登录后使用（本工具含数据库写入能力，仅限授权人员）</p>

      <form id="loginForm" autocomplete="on">
        <div class="login-field">
          <label for="loginUsername">用户名</label>
          <input id="loginUsername" name="username" type="text" autocomplete="username" placeholder="请输入用户名" />
        </div>
        <div class="login-field">
          <label for="loginPassword">密码</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
        </div>
        <div class="login-field login-hidden" id="signupCodeField">
          <label for="signupCode">邀请码</label>
          <input id="signupCode" name="code" type="text" placeholder="请输入管理员提供的邀请码" />
        </div>
        <div class="login-field login-hidden" id="signupDisplayField">
          <label for="signupDisplay">显示名称（可选）</label>
          <input id="signupDisplay" name="displayName" type="text" placeholder="例如：张三（浙江市场）" />
        </div>

        <div class="login-row">
          <label><input id="loginRemember" type="checkbox" /> 记住我（7 天）</label>
        </div>

        <div id="loginMessage" class="login-message"></div>

        <div class="login-actions">
          <button id="loginSubmit" class="primary" type="submit">登录</button>
          <button id="signupToggle" class="login-hidden" type="button">注册新账号</button>
        </div>
      </form>

      <div class="login-foot" id="loginFoot"></div>
    </main>

    <script src="/version.js?v=20260910_app_version"></script>
    <script src="/login.js?v=20260922_signup_role"></script>
  </body>
</html>
